server:
  port: 8080

spring:
  application:
    name: labaudit
  data:
    mongodb:
      uri: mongodb://localhost:27017/labaudit
      auto-index-creation: true

app:
  jwt:
    # 256-bit secret key (Base64 encoded or string >= 32 chars)
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.rkmaharana.labaudit: DEBUG
    org.springframework.security: INFO
